<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCES provider access requests</title>
<style>body{font:15px Arial,sans-serif;margin:32px;color:#182230}main{max-width:1100px;margin:auto}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}button{padding:7px 12px;margin-right:6px;cursor:pointer}.muted{color:#667085}</style></head><body><main><h1>Provider access requests</h1><p class="muted">Requests for your hospital only. Approval creates the PCES account and activates the hospital membership.</p><p id="status" role="status">Loading requests…</p><table><thead><tr><th>Applicant</th><th>Role</th><th>Email</th><th>Phone</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="requests"></tbody></table></main>
<script>
const csrf={{ csrf_token|tojson }};
const body=document.getElementById("requests"), statusEl=document.getElementById("status");
function cell(tr,value){const td=document.createElement("td");td.textContent=value||"—";tr.appendChild(td);return td;}
async function load(){try{const r=await fetch("/auth/entra/admin/requests",{credentials:"same-origin"});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to load requests");body.replaceChildren();for(const item of d.requests){const tr=document.createElement("tr");cell(tr,[item.first_name,item.middle_name,item.last_name].filter(Boolean).join(" "));cell(tr,item.party_type);cell(tr,item.email);cell(tr,item.phone);cell(tr,item.created_at?new Date(item.created_at).toLocaleString():"");cell(tr,item.status);const action=cell(tr,"");if(item.status==="PENDING"){for(const decision of ["APPROVE","REJECT"]){const b=document.createElement("button");b.textContent=decision;b.addEventListener("click",()=>review(item.request_id,decision));action.appendChild(b);}}body.appendChild(tr);}statusEl.textContent=d.requests.length? "Requests for your hospital":"No signup requests found.";}catch(e){statusEl.textContent=e.message;}}
async function review(id,decision){let rejection_reason=null;if(decision==="REJECT"){rejection_reason=window.prompt("Reason for rejection (optional):");if(rejection_reason===null)return;}if(decision==="APPROVE"&&!window.confirm("Approve this provider and activate their hospital membership?"))return;try{const r=await fetch("/auth/entra/admin/requests/"+encodeURIComponent(id)+"/review",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({decision,rejection_reason})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Review failed");statusEl.textContent="Request "+d.status.toLowerCase()+".";await load();}catch(e){statusEl.textContent=e.message;}}
load();
</script></body></html>
