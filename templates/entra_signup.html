<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCES provider registration</title>
<style>
body{font:16px Arial,sans-serif;background:#f4f6f8;margin:0;padding:32px;color:#17212b}.card{max-width:560px;margin:auto;background:white;padding:28px;border-radius:12px;box-shadow:0 2px 14px #0001}label{display:block;margin:14px 0 6px}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd3da;border-radius:6px}button{margin-top:22px;padding:12px 18px;background:#155eef;color:white;border:0;border-radius:6px;cursor:pointer}.error{color:#b42318}.hint{color:#475467;font-size:14px}
</style></head><body><main class="card"><h1>PCES provider registration</h1><p class="hint">Submit a request to join an existing hospital. Your PCES access remains inactive until that hospital's Office Admin approves it.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('entra_signup_bp.signup_submit') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="first_name">First name</label><input id="first_name" name="first_name" maxlength="255" required>
<label for="middle_name">Middle name (optional)</label><input id="middle_name" name="middle_name" maxlength="255">
<label for="last_name">Last name</label><input id="last_name" name="last_name" maxlength="255" required>
<label for="date_of_birth">Date of birth (optional)</label><input id="date_of_birth" name="date_of_birth" type="date">
<label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" maxlength="50">
<label for="party_type">Registering as</label><select id="party_type" name="party_type" required><option value="">Choose role</option><option value="DOCTOR">Doctor</option><option value="NURSE">Nurse</option></select>
<label for="tenant_id">Hospital</label><select id="tenant_id" name="tenant_id" required><option value="">Choose an active hospital</option>{% for h in hospitals %}<option value="{{ h.tenant_id }}">{{ h.tenant_name }}{% if h.tenant_code %} ({{ h.tenant_code }}){% endif %}</option>{% endfor %}</select>
<button type="submit">Submit registration request</button></form></main></body></html>
